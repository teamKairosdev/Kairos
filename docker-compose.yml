services:
  # Kairos Primary PostgreSQL + pgvector Database Service
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kairos-db
    restart: always
    environment:
      POSTGRES_DB: kairos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kairos"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kairos Web Application Single Container Service
  kairos-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kairos-platform
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/kairos
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
